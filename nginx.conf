events {}
http {
  limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
  server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    include /etc/nginx/mime.types;
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    client_max_body_size 1m;
    location /auth/login { limit_req zone=login burst=10 nodelay; limit_req_status 429; proxy_pass http://auth:8000; }
    location /auth/register { limit_req zone=login burst=10 nodelay; limit_req_status 429; proxy_pass http://auth:8000; }
    location /auth/ { proxy_pass http://auth:8000; }
    location /catalog/ { proxy_pass http://catalog:8000; }
    location /circulation/ { proxy_pass http://circulation:8000; }
    location /recommendations/ { proxy_read_timeout 300s; proxy_pass http://recommendations:8000; }
    location /internal/ { return 404; }
    location = /health { access_log off; return 200 'ok'; }
    location /assets/ { try_files $uri =404; expires 1y; }
    location = /index.html { expires -1; }
    location / { try_files $uri $uri/ /index.html; }
  }
}
